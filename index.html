<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotte Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0e2a47; --bg2:#123d2e; --card:#fffaf3; --ink:#2b2522; --muted:#7a6f69; --line:#eadfce;
  --red:#c62828; --red2:#e53935; --red-ink:#fff; --green:#1b7a4b; --gold:#f4b400; --soft:#f6ecdc; --field:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{ --card:#1f2a33; --ink:#f3ece6; --muted:#a9b3bb; --line:#33424e; --soft:#2a3742; --field:#17212a; }
}
*{box-sizing:border-box}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 "Nunito",system-ui,sans-serif;
  background:radial-gradient(ellipse 120% 70% at top,#1d4f7a 0%,var(--bg1) 50%,var(--bg2) 100%);}
body:before{content:"";position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,rgba(14,42,71,.78),rgba(18,61,46,.9)),url(assets/hero.jpg) center/cover no-repeat;}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-10px;color:#fff;opacity:.85;animation:fall linear infinite;user-select:none}
@keyframes fall{to{transform:translate(var(--drift),105vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.flake{display:none}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:36px 16px 64px}
.hero.small{height:150px}
.hero{display:block;height:260px;object-fit:cover;object-position:50% 48%;width:100%;border-radius:18px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.title{text-align:center;color:#fff;margin-bottom:26px}
h1{font-family:"Mountains of Christmas",cursive;font-size:3.2rem;line-height:1.1;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.25)}
h1 span{color:var(--gold)}
.scene{display:block;width:100%;height:auto;margin:0 auto 10px;max-width:520px;clip-path:inset(0 round 0 0 22px 22px)}
.scene .star,.scene .stars circle{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .stars circle:nth-child(2n){animation-delay:1.2s}
@keyframes twinkle{50%{opacity:.55;transform:scale(.96)}}
.sub{color:#dbe7f0;margin:6px 0 0}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);border-top:6px solid var(--red)}
body:not(.ready) .card{animation:pop .5s both}
.card:nth-of-type(2){border-top-color:var(--green)} .card:nth-of-type(3){border-top-color:var(--gold)}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.card h2{font-size:1.1rem;margin:0 0 12px;font-weight:800}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;transition:border-color .2s}
input:focus,select:focus{outline:none;border-color:var(--green)}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.row button{flex:0 0 auto}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--soft);color:var(--ink);transition:transform .15s, box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--red2),var(--red));color:var(--red-ink);box-shadow:0 4px 0 #8e1b1b}
button.big{width:100%;padding:16px;font-size:1.15rem;font-weight:800}
button.big:not(:disabled){animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 #8e1b1b,0 0 0 8px rgba(244,180,0,.35)}}
button:disabled{opacity:.5;cursor:not-allowed}
ul.list{list-style:none;margin:12px 0 0;padding:0}
ul.list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.row.wrap{flex-wrap:wrap}
.row.wrap #name{flex:1 1 140px} .row.wrap #phone{flex:1 1 170px}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ptel{flex:0 1 170px;padding:6px 10px;font-size:.9rem;border-width:1px}
li.send{flex-direction:column;align-items:stretch!important}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions>*{padding:8px 11px;font-size:.92rem}
.btn{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;border-radius:12px;padding:8px 14px;color:#fff;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.sms{background:#1e88e5} .btn.wa{background:#25a244}
.code{font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-all;background:var(--soft);border-radius:10px;padding:10px;margin:8px 0 12px;text-align:left;user-select:all}
.code.small{font-size:.8rem}
details{margin-top:12px;text-align:left} summary{cursor:pointer}
.reveal .actions{justify-content:center}
.ok{color:var(--green);font-weight:800;font-size:1.1rem;margin:4px 0}
.checks{margin:0 0 12px;padding-left:0;list-style:none}
.checks li{padding:2px 0} .checks li:before{content:"✓ ";color:var(--green);font-weight:800}
.card h2 .x{float:right;font-size:.85rem;font-weight:600}
.card a:not(.btn){color:var(--red);font-weight:600}
.spinner{width:36px;height:36px;margin:10px auto;border:4px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.home-btn{position:fixed;top:12px;left:12px;z-index:10;background:rgba(255,250,243,.95);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.home-btn:hover{transform:translateY(-1px)}
.home-btn.hidden{display:none}
ul.list li.new{animation:pop .35s both}
ul.list li:first-child{border-top:0}
.x{background:none;color:var(--muted);padding:4px 8px}
.muted{color:var(--muted);font-size:.9rem}
.hint{color:#dbe7f0;text-align:center;font-size:.9rem}
.countdown{position:relative;overflow:hidden;text-align:center;margin:16px 0 8px;padding:14px 10px 12px;border-radius:18px;color:#fff8ec;
  background:radial-gradient(120% 90% at 50% 0%,#2a8a5a 0%,#145c3a 55%,#0d3f28 100%);
  box-shadow:inset 0 0 0 2px rgba(244,180,0,.55),0 8px 20px rgba(0,0,0,.22)}
.countdown:before,.countdown:after{content:"❄";position:absolute;font-size:22px;opacity:.25;top:6px}
.countdown:before{left:12px} .countdown:after{right:12px;top:auto;bottom:6px;transform:rotate(25deg)}
.cd-title{margin:0 0 10px;text-align:center;font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:1.6rem;line-height:1;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.cd{display:flex;justify-content:center;gap:6px;max-width:340px;margin:0 auto}
.cd div{flex:1;max-width:76px;display:flex;flex-direction:column;align-items:center;gap:5px}
.cd b{display:block;width:100%;text-align:center;padding:8px 0 6px;border-radius:12px;font-size:1.9rem;font-weight:800;line-height:1;color:var(--red);
  font-variant-numeric:tabular-nums;background:linear-gradient(#fffdf8 0 49%,#f1e6d6 51% 100%);box-shadow:0 3px 0 #b8860b,0 6px 10px rgba(0,0,0,.25)}
.cd span{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff8ec;opacity:.9}
.cd-sub{margin:10px 0 0;font-size:.85rem;opacity:.85}
.cd-done{margin:0;font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:1.9rem;color:var(--gold)}
.seen{color:var(--green);font-weight:700;white-space:nowrap}
.unseen{color:#b26a00;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.seenbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
.seenbar div{height:100%;background:linear-gradient(90deg,var(--green),#2fa66b);border-radius:99px;transition:width .6s}
ul.list li.mine{padding:0}
ul.list li.mine a{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 4px;text-decoration:none}
ul.list li.mine a span:first-child{text-decoration:underline}
.err{color:#fff;background:var(--red);border-radius:12px;padding:10px 14px;font-weight:600;margin-top:10px}
.link{flex:1;min-width:0;display:flex;gap:8px;align-items:center}
.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;color:var(--muted)}
.reveal{text-align:center;padding:36px 20px}
.reveal h1{color:var(--red);text-shadow:none;font-size:2.6rem}
.reveal .big{font-family:"Mountains of Christmas",cursive;font-size:3.4rem;line-height:1.1;color:var(--green);margin:8px 0 14px;animation:zoom .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes zoom{from{transform:scale(0) rotate(-10deg);opacity:0}}
.hidden{display:none}
/* Cadeau CSS */
.box{position:relative;width:130px;height:120px;margin:26px auto 22px;cursor:pointer;animation:shake 2.2s ease-in-out infinite}
.box .base{position:absolute;bottom:0;left:8px;right:8px;height:84px;background:var(--red);border-radius:6px}
.box .lid{position:absolute;top:10px;left:0;right:0;height:30px;background:var(--red2);border-radius:6px;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .7s}
.box .rib-v{position:absolute;top:10px;bottom:0;left:50%;width:18px;margin-left:-9px;background:var(--gold)}
.box .bow{position:absolute;top:-8px;left:50%;width:70px;height:24px;margin-left:-35px}
.box .bow:before,.box .bow:after{content:"";position:absolute;top:0;width:32px;height:20px;border:6px solid var(--gold);border-radius:50%}
.box .bow:before{left:0;transform:rotate(-25deg)} .box .bow:after{right:0;transform:rotate(25deg)}
.box .top{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .7s}
.box.open{animation:none}
.box.open .top{transform:translate(40px,-120px) rotate(35deg);opacity:0}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}85%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:5;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>
<a id="homeBtn" class="home-btn hidden" href="#">🏠 Accueil</a>
<main id="app"></main>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- Compte à rebours jusqu'au jour de l'échange ----------
function countdown(date){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "")) return "";
  return `<div class="countdown" data-date="${esc(date)}" aria-live="off"></div>`;
}
function tickCountdowns(){
  document.querySelectorAll(".countdown").forEach(el => {
    const [y, m, d] = el.dataset.date.split("-").map(Number);
    const ms = new Date(y, m - 1, d) - new Date();
    if (ms <= -86400000) { el.innerHTML = `<p class="cd-done">L'échange a eu lieu 🎄</p>`; return; }
    if (ms <= 0) { el.innerHTML = `<p class="cd-done">🎉 C'est le grand jour !</p>`; return; }
    const s = Math.floor(ms / 1000), parts = [[Math.floor(s / 86400), "jours"], [Math.floor(s / 3600) % 24, "heures"], [Math.floor(s / 60) % 60, "min"], [s % 60, "sec"]];
    if (!el.querySelector(".cd")) el.innerHTML = `<p class="cd-title">Le grand jour approche !</p><div class="cd">${parts.map(([, l]) => `<div><b></b><span>${l}</span></div>`).join("")}</div><p class="cd-sub">avant l'échange des cadeaux 🎁</p>`;
    el.querySelectorAll(".cd b").forEach((b, i) => { const v = String(parts[i][0]).padStart(2, "0"); if (b.textContent !== v) b.textContent = v; });
  });
}
setInterval(tickCountdowns, 1000);
new MutationObserver(() => { if (document.querySelector(".countdown:empty")) tickCountdowns(); }).observe(document.documentElement, { childList: true, subtree: true });

// ---------- Mode révélation ----------
function renderReveal(data){
  document.title = "Ton Secret Santa";
  const app = document.getElementById("app");
  app.innerHTML = `
    <img class="hero small" src="assets/hero.jpg" alt="" onerror="this.remove()">
    <div class="card reveal">
      <p class="muted" style="margin:0">${esc(data.e || "Secret Santa")}</p>
      <h1>Bonjour ${esc(data.g)} !</h1>
      <div id="hide">
        <div class="box" id="box" role="button" tabindex="0" aria-label="Ouvrir le cadeau">
          <div class="base"></div><div class="rib-v"></div>
          <div class="top"><div class="lid"></div><div class="bow"></div></div>
        </div>
        <p class="muted">Vérifie que personne ne regarde ton écran, puis ouvre le cadeau.</p>
        <button class="primary" id="btn">🎁 Ouvrir mon cadeau</button>
      </div>
      <div id="show" class="hidden">
        <p style="margin:0">Tu offres un cadeau à</p>
        <div class="big">${esc(data.r)}</div>
        ${data.b ? `<p>💰 Budget : <strong>${esc(data.b)}</strong></p>` : ""}
        ${data.d ? `<p>📅 Échange des cadeaux : <strong>${esc(new Date(data.d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))}</strong></p>` : ""}
        ${countdown(data.d)}
        <p class="muted">Chut, c'est un secret 🤫</p>
      </div>
    </div>`;
  const open = () => {
    const box = document.getElementById("box");
    if (box.classList.contains("open")) return;
    box.classList.add("open");
    document.getElementById("btn").classList.add("hidden");
    confetti();
    setTimeout(() => {
      document.getElementById("hide").classList.add("hidden");
      document.getElementById("show").classList.remove("hidden");
    }, 700);
  };
  document.getElementById("btn").onclick = open;
  document.getElementById("box").onclick = open;
  document.getElementById("box").onkeydown = e => { if (e.key === "Enter" || e.key === " ") open(); };
}

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#c62828","#f4b400","#1b7a4b","#ffffff","#e53935","#4fc3f7"];
  for (let i=0;i<120;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", (Math.random()*200-100) + "px");
    c.style.setProperty("--rot", (Math.random()*1080) + "deg");
    c.style.animationDuration = (2 + Math.random()*2) + "s";
    c.style.animationDelay = (Math.random()*0.4) + "s";
    if (Math.random() < .5) c.style.borderRadius = "50%";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4600);
  }
}

function snow(){
  const el = document.getElementById("snow"), chars = ["❄","❅","❆","•"];
  for (let i=0;i<40;i++){
    const f = document.createElement("span");
    f.className = "flake";
    f.textContent = chars[i % chars.length];
    f.style.left = Math.random()*100 + "vw";
    f.style.fontSize = (8 + Math.random()*16) + "px";
    f.style.setProperty("--drift", (Math.random()*80-40) + "px");
    f.style.animationDuration = (8 + Math.random()*10) + "s";
    f.style.animationDelay = (-Math.random()*18) + "s";
    el.appendChild(f);
  }
}
snow();

// ---------- Serveur (Google Apps Script) ----------
const MAX_PEOPLE = 40;  // même limite que le serveur
const API_URL = "https://script.google.com/macros/s/AKfycbwm2KjPCcGVJFwsQXmCtLmKH0j3-nqV_HB-3sOvIJNM333204rQ3JAOXXQvkvFojZsG/exec";

async function api(action, data){
  if (!API_URL) throw new Error("Le serveur n'est pas encore configuré.");
  let res;
  try { res = await fetch(API_URL, { method:"POST", body: JSON.stringify(Object.assign({ action }, data)) }); }
  catch(e){ throw new Error("Impossible de joindre le serveur. Vérifie ta connexion et réessaie."); }
  const out = await res.json().catch(() => ({ error: "Réponse inattendue du serveur." }));
  if (out.error) throw new Error(out.error);
  return out;
}
// Désactive un bouton pendant un appel et affiche l'erreur éventuelle dans #msg
async function busy(btn, fn){
  const label = btn.textContent, msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Un instant…";
  if (msg) { msg.className = "hidden"; msg.textContent = ""; }
  try { await fn(); }
  catch(e){ if (msg) { msg.textContent = e.message; msg.className = "err"; } }
  finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; } }
}

// ---------- Utilitaires d'envoi ----------
function intl(phone){
  let d = String(phone||"").replace(/[^\d+]/g,"");
  if (d.startsWith("+")) return d.slice(1);
  if (d.startsWith("00")) return d.slice(2);
  if (d.startsWith("0") && d.length === 10) return "33" + d.slice(1);
  return d;
}
function sendButtons(text, copyValue){
  const msg = encodeURIComponent(text);
  return `<div class="actions">
    <a class="btn sms" href="sms:?&body=${msg}">💬 SMS</a>
    <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${msg}">🟢 WhatsApp</a>
    <button data-copy="${esc(copyValue ?? text)}">🔗 Copier</button>
  </div>`;
}
function bindCopy(root){
  root.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = "Copié ✓"; setTimeout(() => b.textContent = t, 1500); }
    catch(e){ window.prompt("Copie ce texte :", b.dataset.copy); }
  });
}
const baseUrl = () => location.href.split("#")[0];
const fmtDate = d => new Date(d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const eventInfo = ev => `${ev.budget ? `<p>💰 Budget : <strong>${esc(ev.budget)}</strong></p>` : ""}${ev.date ? `<p>📅 Échange : <strong>${esc(fmtDate(ev.date))}</strong></p>` : ""}${countdown(ev.date)}`;
const app = () => document.getElementById("app");
const hero = (small) => `<img class="hero${small?" small":""}" src="assets/hero.jpg" alt="" onerror="this.remove()">`;
const loading = () => { app().innerHTML = hero(true) + `<div class="card reveal"><div class="spinner"></div><p class="muted">Chargement…</p></div>`; };
const fail = (m) => { app().innerHTML = hero(true) + `<div class="card reveal"><h1>Oups</h1><p>${esc(m)}</p><p><a href="${baseUrl()}">Retour à l'accueil</a></p></div>`; };

// ---------- Connexion Google (organisateurs) ----------
const GOOGLE_CLIENT_ID = "841116298846-u2p0did8cuubiabmauqtsfvsmaf2qfp7.apps.googleusercontent.com";
function googleSession(){
  try {
    const g = JSON.parse(sessionStorage.getItem("hotte-google") || "null");
    return g && g.exp * 1000 > Date.now() + 60000 ? g : null;
  } catch(e){ return null; }
}
function googleLogout(){ try { sessionStorage.removeItem("hotte-google"); } catch(e){} if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); }
function loadGis(){
  if (window.google && google.accounts) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = ok; s.onerror = () => ko(new Error("Impossible de charger la connexion Google."));
    document.head.appendChild(s);
  });
}
// Affiche le bouton Google dans `el` ; appelle `done` une fois connecté
async function googleButton(el, done){
  try { await loadGis(); } catch(e){ el.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: r => {
    try {
      const b = r.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      const info = JSON.parse(decodeURIComponent(escape(atob(b))));
      sessionStorage.setItem("hotte-google", JSON.stringify({ token: r.credential, email: info.email, exp: info.exp }));
    } catch(e){}
    done();
  }});
  google.accounts.id.renderButton(el, { theme: "filled_blue", size: "large", shape: "pill", text: "signin_with", locale: "fr" });
}

function myEvents(){ try { return JSON.parse(localStorage.getItem("hotte-admin") || "[]"); } catch(e){ return []; } }
function rememberEvent(e){ const l = myEvents().filter(x => x.id !== e.id); l.unshift(e); try { localStorage.setItem("hotte-admin", JSON.stringify(l.slice(0,10))); } catch(err){} }

// ---------- Accueil : créer un Secret Santa ----------
function renderHome(){
  setTimeout(() => document.body.classList.add("ready"), 600);
  document.title = "Hotte Surprise";
  const g = GOOGLE_CLIENT_ID ? googleSession() : null, needLogin = GOOGLE_CLIENT_ID && !g;
  const mine = myEvents();
  app().innerHTML = `
    ${hero()}
    <div class="title">
      <h1>Hotte <span>Surprise</span></h1>
      <p class="sub">Chacun s'inscrit avec son email, tu lances le tirage, chacun reçoit le sien par email. Personne, pas même toi, ne voit qui offre à qui.</p>
    </div>
    <div id="mine">${mine.length ? mineCard(mine) : ""}</div>
    <div class="card">
      <h2>🎄 Créer un Secret Santa</h2>
      <p class="muted" style="margin-top:0">Jusqu'à ${MAX_PEOPLE} participants par Secret Santa.</p>
      ${needLogin ? `<p>Connecte-toi avec ton compte Google pour créer un Secret Santa et retrouver les tiens sur tous tes appareils.</p><div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>` : ""}
      ${g ? `<p class="muted">Connecté·e : <strong>${esc(g.email)}</strong> · <a href="#" id="logout">se déconnecter</a></p>` : ""}
      <form id="create"${needLogin ? ' class="hidden"' : ""}>
        <label>Nom</label><input id="name" placeholder="Noël en famille 2026" required>
        <div class="row">
          <div><label>Budget</label><input id="budget" placeholder="30 €"></div>
          <div><label>Date de l'échange <span class="muted" style="font-weight:400">(compte à rebours + rappel J-7)</span></label><input id="date" type="date"></div>
        </div>
        ${GOOGLE_CLIENT_ID ? "" : `<label>Ton email (pour recevoir ton accès organisateur)</label><input id="email" type="email" required autocomplete="email">`}
        <button class="primary big" style="margin-top:16px">Créer</button>
      </form>
      <p id="msg" class="hidden"></p>
    </div>
    <p class="hint">Pas envie d'inscriptions ? <a href="simple.html" style="color:#fff">Utilise la version rapide</a>, où tu envoies toi-même les liens.</p>`;
  document.getElementById("create").onsubmit = e => {
    e.preventDefault();
    busy(e.submitter || e.target.querySelector("button"), async () => {
      const v = id => document.getElementById(id).value.trim();
      const gs = GOOGLE_CLIENT_ID ? googleSession() : null;
      if (GOOGLE_CLIENT_ID && !gs) { renderHome(); throw new Error("Ta connexion Google a expiré, reconnecte-toi."); }
      const r = await api("createEvent", gs ? { name: v("name"), budget: v("budget"), date: v("date"), idToken: gs.token }
                                             : { name: v("name"), budget: v("budget"), date: v("date"), orgEmail: v("email") });
      rememberEvent({ id: r.eventId, token: r.adminToken, name: v("name") });
      location.hash = "admin=" + r.eventId + "." + r.adminToken;
    });
  };
  if (needLogin) googleButton(document.getElementById("gbtn"), renderHome);
  const lo = document.getElementById("logout");
  if (lo) lo.onclick = e => { e.preventDefault(); googleLogout(); renderHome(); };
  // Connecté : on complète la liste avec les Secret Santa du compte Google (tous appareils)
  if (g) api("myEvents", { idToken: g.token }).then(r => {
    const known = new Set(mine.map(e => e.id));
    const all = mine.concat(r.events.filter(e => !known.has(e.id)).map(e => ({ id: e.id, token: "g", name: e.name })));
    if (all.length && document.getElementById("mine")) document.getElementById("mine").innerHTML = mineCard(all);
  }).catch(() => {});
}
function mineCard(list){
  return `<div class="card"><h2>Mes Secret Santa</h2><ul class="list">${list.map(e => `<li class="mine"><a href="#admin=${esc(e.id)}.${esc(e.token)}"><span>${esc(e.name)}</span><span class="muted">gérer →</span></a></li>`).join("")}</ul></div>`;
}

// ---------- Espace organisateur ----------
const superKey = () => { try { return sessionStorage.getItem("hotte-super") || ""; } catch(e){ return ""; } };
const adminAuth = (id, token) => token === "super" ? { eventId:id, superKey: superKey() }
  : token === "g" ? { eventId:id, idToken: (googleSession() || {}).token || "" } : { eventId:id, adminToken:token };
async function renderAdmin(id, token, data){
  setTimeout(() => document.body.classList.add("ready"), 600);
  if (!data) { loading(); try { data = await api("adminGet", adminAuth(id, token)); } catch(e){ return fail(e.message); } }
  if (token !== "super" && token !== "g") rememberEvent({ id, token, name: data.name });
  document.title = data.name + " · Organisateur";
  const joinUrl = baseUrl() + "#e=" + id;
  const invite = `🎄 Tu es invité·e au Secret Santa « ${data.name} » ! Inscris-toi ici avec ton email : ${joinUrl}`;
  const byId = Object.fromEntries(data.participants.map(p => [p.id, p.name]));
  const opts = data.participants.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  const open = data.status === "open";
  app().innerHTML = `
    ${hero()}
    <div class="title"><h1>${esc(data.name)}</h1><p class="sub">${token === "super" ? `Super-admin · organisateur : ${esc(data.orgEmail)} · <a href="#super" style="color:#fff">← tous les Secret Santa</a>` : "Espace organisateur · garde ce lien pour toi"}</p></div>

    <div class="card">
      <h2>1. Invite les participants</h2>
      ${eventInfo(data)}
      ${open ? `<p class="muted" style="margin-top:0">Envoie ce lien à tout le monde (${MAX_PEOPLE} participants maximum). Chacun s'inscrit avec son email et reçoit un code secret. Si tu participes, inscris-toi aussi.</p>
      ${sendButtons(invite, joinUrl)}` : `<p class="muted">Les inscriptions sont fermées.</p>`}
    </div>

    <div class="card">
      <h2>2. Inscrits (${data.participants.length}/${MAX_PEOPLE}) <button class="x" id="refresh" title="Actualiser">🔄 Actualiser</button></h2>
      ${data.participants.length ? "" : `<p class="muted">Personne pour l'instant. Les inscriptions apparaîtront ici.</p>`}
      ${open ? `<form class="row" id="addName" style="margin-top:6px"><input id="addNameInput" placeholder="Inscrire quelqu'un sans email (prénom)" autocomplete="off"><button>Inscrire</button></form>
      <p class="muted" style="margin:6px 0 0">Tu recevras son code secret par email, à lui transmettre.</p>` : ""}
      <ul class="list">${data.participants.map(p => `<li><span class="pname">${esc(p.name)} <span class="muted">${p.email ? esc(p.email) : "sans email"}</span></span>${open ? `<button class="x" data-del="${esc(p.id)}" aria-label="Retirer ${esc(p.name)}">✕</button>` : (p.seen ? `<span class="seen">✅ vu</span>` : `<span class="unseen">⏳ pas vu${p.email ? ` <button class="x" data-resend="${esc(p.id)}">Relancer</button>` : ` <span class="muted">à prévenir</span>`}</span>`)}</li>`).join("")}</ul>
      ${!open && data.participants.length ? (() => { const seen = data.participants.filter(p => p.seen).length, n = data.participants.length, todo = data.participants.filter(p => !p.seen && p.email).length;
        return `<div class="seenbar"><div style="width:${Math.round(seen / n * 100)}%"></div></div>
        <p class="muted" style="margin:6px 0 0">👀 <strong>${seen}/${n}</strong> ont découvert leur tirage.${seen === n ? " Tout le monde l'a vu 🎉" : ""}</p>
        ${todo ? `<button class="primary" id="remindAll" style="margin-top:10px">📧 Relancer les ${todo} qui n'ont pas vu</button><p id="remindMsg" class="ok hidden"></p>` : ""}`; })() : ""}
    </div>

    ${open ? `
    <div class="card">
      <h2>3. Exclusions <span class="muted">(facultatif)</span></h2>
      <p class="muted" style="margin:0">Pour éviter que deux personnes se tirent entre elles, par exemple un couple.</p>
      <div class="row" style="margin-top:10px"><select id="exA">${opts}</select><select id="exB">${opts}</select><button id="addEx">Ajouter</button></div>
      <ul class="list">${data.exclusions.map(([a,b],i)=>`<li>${esc(byId[a])} ↔ ${esc(byId[b])}<button class="x" data-delex="${i}" aria-label="Retirer">✕</button></li>`).join("")}</ul>
    </div>
    <div id="drawZone">
      <button class="primary big" id="go" ${data.participants.length<3?"disabled":""}>🎲 Lancer le tirage</button>
      ${data.participants.length<3?`<p class="hint">Il faut au moins 3 inscrits.</p>`:""}
    </div>` : `
    <div class="card">
      <h2>🎉 Le tirage est fait</h2>
      ${data.verified ? `<p class="ok">✓ Tirage vérifié</p>
      <ul class="checks"><li>Chaque participant offre à une seule personne</li><li>Personne n'est tiré deux fois</li><li>Personne ne s'est tiré soi-même</li><li>Toutes les exclusions sont respectées</li></ul>` : `<p class="err">La vérification du tirage a échoué. Contacte le support.</p>`}
      ${data.noEmail && data.noEmail.length ? `<p>Sans email : <strong>${esc(data.noEmail.join(", "))}</strong>. Ils découvrent leur tirage sur la page du Secret Santa avec leur code.</p>` : ""}
      <p>Chacun a reçu son tirage par email${data.sent != null ? ` (${data.sent} email${data.sent>1?"s":""} envoyé${data.sent>1?"s":""})` : ""}. Toi non plus, tu ne peux pas voir les résultats.</p>
      ${data.failed && data.failed.length ? `<p class="err">Échec d'envoi pour : ${esc(data.failed.join(", "))}. Utilise « Renvoyer l'email ».</p>` : ""}
    </div>`}
    <p id="msg" class="hidden"></p>`;
  bindCopy(app());
  const call = (btn, action, extra) => busy(btn, async () => renderAdmin(id, token, await api(action, Object.assign(adminAuth(id, token), extra))));
  const addName = document.getElementById("addName");
  if (addName) addName.onsubmit = e => {
    e.preventDefault();
    const name = document.getElementById("addNameInput").value.trim();
    if (name) call(addName.querySelector("button"), "adminAdd", { name });
  };
  document.getElementById("refresh").onclick = e => call(e.currentTarget, "adminGet");
  app().querySelectorAll("[data-del]").forEach(b => b.onclick = () => call(b, "adminUpdate", { removeId: b.dataset.del }));
  const remindAll = document.getElementById("remindAll");
  if (remindAll) remindAll.onclick = () => busy(remindAll, async () => {
    const r = await api("adminRemindUnseen", adminAuth(id, token));
    const m = document.getElementById("remindMsg"); m.classList.remove("hidden"); m.textContent = `📧 Rappel envoyé à ${r.sent} personne${r.sent > 1 ? "s" : ""}.` + (r.noEmail.length ? ` Pense à prévenir : ${r.noEmail.join(", ")}.` : "");
  });
  app().querySelectorAll("[data-resend]").forEach(b => b.onclick = () => busy(b, async () => { await api("adminResend", Object.assign(adminAuth(id, token), { participantId: b.dataset.resend })); b.textContent = "Envoyé ✓"; }));
  app().querySelectorAll("[data-delex]").forEach(b => b.onclick = () => { const ex = data.exclusions.slice(); ex.splice(+b.dataset.delex,1); call(b, "adminUpdate", { exclusions: ex }); });
  const addEx = document.getElementById("addEx");
  if (addEx) addEx.onclick = () => {
    const a = document.getElementById("exA").value, b = document.getElementById("exB").value;
    if (!a || a === b || data.exclusions.some(([x,y]) => (x===a&&y===b)||(x===b&&y===a))) return;
    call(addEx, "adminUpdate", { exclusions: data.exclusions.concat([[a,b]]) });
  };
  const go = document.getElementById("go");
  if (go) go.onclick = () => {
    document.getElementById("drawZone").innerHTML = `<div class="card reveal">
      <p><strong>Prêt à lancer le tirage pour ${data.participants.length} personnes ?</strong></p>
      <p class="muted">Les inscriptions seront fermées et chacun recevra son tirage par email. On ne pourra plus le refaire.</p>
      <div class="actions"><button class="primary" id="confirm">🎲 Oui, lancer le tirage</button><button id="cancel">Annuler</button></div></div>`;
    document.getElementById("cancel").onclick = () => renderAdmin(id, token, data);
    document.getElementById("confirm").onclick = e => call(e.currentTarget, "adminDraw");
  };
}

// ---------- Page participant : inscription puis découverte du tirage ----------
async function renderEvent(id, token){
  setTimeout(() => document.body.classList.add("ready"), 600);
  loading();
  if (token) {
    try {
      const r = await api("reveal", { eventId:id, token });
      if (!r.waiting) return renderReveal(r);
    } catch(e){ /* lien invalide : on affiche la page normale */ }
  }
  let ev;
  try { ev = await api("getEvent", { eventId:id }); } catch(e){ return fail(e.message); }
  document.title = ev.name + " · Secret Santa";
  const open = ev.status === "open";
  app().innerHTML = `
    ${hero(true)}
    <div class="card reveal">
      <p class="muted" style="margin:0">Secret Santa</p>
      <h1>${esc(ev.name)}</h1>
      ${eventInfo(ev)}
      <p class="muted">${ev.count}/${MAX_PEOPLE} inscrit${ev.count>1?"s":""}${open ? "" : " · tirage effectué 🎉"}</p>
    </div>
    ${open ? `
    <div class="card">
      <h2>✨ Je m'inscris</h2>
      <form id="join">
        <label>Ton prénom</label><input id="jname" required autocomplete="given-name">
        <label>Ton email</label><input id="jemail" type="email" required autocomplete="email">
        <button class="primary big" style="margin-top:16px">Je participe</button>
      </form>
      <div id="joined" class="hidden"></div>
    </div>` : ""}
    <div class="card">
      <h2>🎁 Découvrir mon tirage</h2>
      <p class="muted" style="margin-top:0">${open ? "Le tirage n'a pas encore eu lieu. Tu recevras un email dès qu'il sera fait." : "Clique sur le lien reçu par email, ou entre simplement ton code secret."}</p>
      <form id="find">
        <div class="row"><input id="fcode" inputmode="numeric" pattern="[0-9 ]*" placeholder="Ton code secret" required autocomplete="one-time-code" style="font-size:1.3rem;letter-spacing:.3em;text-align:center"><button class="primary">Voir</button></div>
      </form>
    </div>
    <p id="msg" class="hidden"></p>`;
  const join = document.getElementById("join");
  if (join) join.onsubmit = e => {
    e.preventDefault();
    busy(join.querySelector("button"), async () => {
      const r = await api("register", { eventId:id, name: document.getElementById("jname").value.trim(), email: document.getElementById("jemail").value.trim() });
      join.classList.add("hidden");
      const j = document.getElementById("joined");
      j.innerHTML = `<p class="ok">✓ ${r.again ? "Te revoilà" : "C'est noté"}, ${esc(r.name)} !</p><p>Ton code secret vient de t'être envoyé par email${r.again ? " (c'est un nouveau code, l'ancien ne marche plus)" : ""}. Regarde aussi dans tes spams. Garde-le précieusement jusqu'au tirage.</p>`;
      j.classList.remove("hidden");
    });
  };
  document.getElementById("find").onsubmit = e => {
    e.preventDefault();
    busy(e.target.querySelector("button"), async () => {
      const r = await api("reveal", { eventId:id, code: document.getElementById("fcode").value.trim() });
      if (r.waiting) throw new Error(`Patience ${r.name}, le tirage n'a pas encore eu lieu !`);
      renderReveal(r);
    });
  };
}

// ---------- Super-admin : tous les Secret Santa ----------
async function renderSuper(){
  setTimeout(() => document.body.classList.add("ready"), 600);
  document.title = "Super-admin · Hotte Surprise";
  const key = superKey();
  if (!key) {
    loading();
    let st; try { st = await api("superStatus", {}); } catch(e){ return fail(e.message); }
    app().innerHTML = `${hero(true)}
      <div class="card"><h2>🔐 Super-admin</h2>
        <p class="muted" style="margin-top:0">${st.configured ? "Entre le mot de passe administrateur pour gérer tous les Secret Santa." : "Crée ton mot de passe administrateur (8 caractères minimum). Il ne pourra être créé qu'une seule fois."}</p>
        <form id="sform" class="row"><input id="skey" type="password" autocomplete="${st.configured ? "current-password" : "new-password"}" placeholder="Mot de passe" required><button class="primary">${st.configured ? "Entrer" : "Créer"}</button></form>
      </div><p id="msg" class="hidden"></p>`;
    document.getElementById("sform").onsubmit = e => {
      e.preventDefault();
      busy(e.target.querySelector("button"), async () => {
        const k = document.getElementById("skey").value;
        if (!st.configured) await api("superSetup", { superKey: k });
        await api("superList", { superKey: k });
        try { sessionStorage.setItem("hotte-super", k); } catch(err){}
        renderSuper();
      });
    };
    return;
  }
  loading();
  let list;
  try { list = (await api("superList", { superKey: key })).events; }
  catch(e){ try { sessionStorage.removeItem("hotte-super"); } catch(err){} return fail(e.message); }
  app().innerHTML = `${hero(true)}
    <div class="title"><h1>Super-admin</h1><p class="sub">${list.length} Secret Santa · tu peux tout gérer, mais pas voir les tirages</p></div>
    <div class="card"><ul class="list">${list.length ? list.map(ev => `
      <li class="send" data-row="${esc(ev.id)}"><div><strong>${esc(ev.name)}</strong> <span class="muted">${ev.status === "drawn" ? "🎉 tirage fait" : "📝 inscriptions ouvertes"} · ${ev.count} inscrit${ev.count>1?"s":""}</span><br>
        <span class="muted">${esc(ev.orgEmail)}${ev.created ? " · créé le " + esc(new Date(ev.created).toLocaleDateString("fr-FR")) : ""}</span></div>
        <div class="actions"><a class="btn sms" href="#admin=${esc(ev.id)}.super">Gérer</a><a class="btn wa" href="#e=${esc(ev.id)}" target="_blank" rel="noopener">Page publique</a><button data-sdel="${esc(ev.id)}">🗑 Supprimer</button></div></li>`).join("") : `<li class="muted">Aucun Secret Santa pour l'instant.</li>`}</ul></div>
    <p style="text-align:center"><button id="logout">Se déconnecter</button></p>
    <p id="msg" class="hidden"></p>`;
  document.getElementById("logout").onclick = () => { try { sessionStorage.removeItem("hotte-super"); } catch(e){} renderSuper(); };
  app().querySelectorAll("[data-sdel]").forEach(b => b.onclick = () => {
    if (b.dataset.armed) return busy(b, async () => { await api("superDelete", { superKey: key, eventId: b.dataset.sdel }); renderSuper(); });
    b.dataset.armed = "1"; b.textContent = "Confirmer la suppression ?"; b.classList.add("primary");
  });
}

function route(){
  document.body.classList.remove("ready");
  document.getElementById("homeBtn").classList.toggle("hidden", location.hash.length <= 1);
  window.scrollTo(0, 0);
  const h = new URLSearchParams(location.hash.slice(1));
  if (location.hash === "#super") return renderSuper();
  if (h.get("admin")) { const [id, token] = h.get("admin").split("."); return renderAdmin(id, token); }
  if (h.get("e")) return renderEvent(h.get("e"), h.get("t"));
  renderHome();
}
window.onhashchange = route;
route();
</script>
</body>
</html>
