<!doctype html><meta charset="utf-8"><title>Envoi</title><body style="font-family:sans-serif">Envoi du fichier…<script>
(async()=>{const f=new URLSearchParams(location.search).get('f');const T=window.opener||(window.parent!==window?window.parent:null);if(!/^[\w.-]+$/.test(f)||!T)return document.body.textContent='Rien à envoyer.';
const r=await fetch(f);const b=await r.arrayBuffer();T.postMessage({hsFile:f,type:r.headers.get('content-type'),buf:b},'https://www.tiktok.com',[b]);document.body.textContent='Envoyé ✔';})();
</script>
